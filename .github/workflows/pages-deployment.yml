name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: bunny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy to bunny.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Deploy to bunny.net
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: BunnyWay/actions/deploy-site@931a74b9c45ea9f9f01435fbbf1649830e67d3b3
        with:
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          site: unixtime-app
          directory: dist
          cli_version: '0.19.0'

      - name: Clean up old deployments
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: npx --yes @bunny.net/cli@0.19.0 sites deployments prune unixtime-app --keep 3 --force
